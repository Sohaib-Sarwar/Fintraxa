<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Personal Finance & Investment Management" />
    
    <meta property="og:title" content="Fintraxa" />
    <meta property="og:description" content="Personal Finance & Investment Management" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons. These all pointed at one 690 kB PNG, including as a 32x32
         favicon; they are now size-matched files. -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open the database and market-data connections while the JavaScript loads,
         so the first queries do not pay for DNS, TCP and TLS on a cold start. -->
    <link rel="preload" as="image" href="/brand/mark-256.png" fetchpriority="high" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="https://sohaib-sarwar.github.io" crossorigin />

    <!-- Fonts are bundled (@fontsource-variable, imported in src/main.jsx) and served
         from this origin. Google Fonts was blocked in production by the CSP
         (style-src/font-src 'self'), so text fell back to each OS's system font. -->

    <!-- The login plate is the largest paint on the first screen an unknown
         visitor sees, so it is fetched alongside the bundle rather than after
         it. 19 kB / 14 kB; the matching one only. -->
    <link rel="preload" as="image" href="/login-bg.webp" type="image/webp" media="(min-width: 901px)" />
    <link rel="preload" as="image" href="/login-bg-mobile.webp" type="image/webp" media="(max-width: 900px)" />

    <title>Fintraxa</title>
  </head>
  <body>
    <div id="root">
      <!-- Initial loader — theme-aware via localStorage, removed by React on mount -->
      <!-- Boot loader (same as src/components/BrandLoader.jsx, so React takes over without a flicker).
           transform/opacity animations only: they run on the compositor and never freeze while
           the app's JavaScript is parsing. Theme from the saved preference, before first paint. -->
      <div id="initial-loader" role="status" aria-label="Loading Fintraxa">
        <style>
          @keyframes fx-breathe { 0%, 100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
          @keyframes fx-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
          #initial-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; min-height: 100dvh; background: #fff; }
          #initial-loader.dark { background: #000; }
          #initial-loader img { display: block; width: 64px; height: 64px; will-change: transform, opacity; animation: fx-breathe 1.8s ease-in-out infinite; }
          #initial-loader .track { position: relative; width: 120px; height: 3px; border-radius: 999px; overflow: hidden; background: rgba(0,0,0,.08); }
          #initial-loader.dark .track { background: rgba(255,255,255,.10); }
          #initial-loader .bar { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 999px; will-change: transform;
            background: linear-gradient(90deg, transparent, #d9b48f, transparent); animation: fx-slide 1.2s cubic-bezier(.45,.05,.55,.95) infinite; }
          @media (prefers-reduced-motion: reduce) { #initial-loader img, #initial-loader .bar { animation: none; } }
        </style>
        <img src="/brand/mark-256.png" alt="" width="64" height="64" fetchpriority="high" />
        <div class="track"><div class="bar"></div></div>
        <script>
          (function () {
            var stored = null;
            try { stored = localStorage.getItem('pt-theme'); } catch (e) {}
            var isDark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.getElementById('initial-loader').classList.add('dark');
          })();
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
